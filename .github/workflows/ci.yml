name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --locked --dev

      - name: Run unit tests
        run: uv run --frozen python -m unittest discover -s tests

      - name: Build wheel
        if: matrix.python-version == '3.12'
        run: uv build --wheel

      - name: Smoke test wheel
        if: matrix.python-version == '3.12'
        run: uv run --isolated --no-project --with dist/*.whl vcli --version

      - name: Install tool from checkout
        if: matrix.python-version == '3.12'
        run: |
          uv tool install .
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Smoke test tool installation
        if: matrix.python-version == '3.12'
        run: |
          installed_version="$(vcli --version)"
          expected_version="$(uv run --frozen python -c 'from importlib.metadata import version; print(version("unofficial-velog-cli"))')"
          test "$installed_version" = "$expected_version"
          vcli --help >/dev/null
